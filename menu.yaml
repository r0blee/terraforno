# ═══════════════════════════════════════════════════════════════
#  terraforno — menu.yaml
#
#  Fetched at startup from GitHub to dynamically build the menu.
#  Hosted at: https://github.com/r0blee/terraforno
#
#  Structure:
#    menu[]                  top-level menu items
#      .id                   unique identifier (matches module folder name)
#      .label                display text shown in the menu
#      .description          one-line summary (shown on hover/detail views)
#      .items[]              sub-menu items (omit for leaf nodes)
#      .module               relative path to the deploy.sh folder (leaf nodes only)
#      .apis[]               which Jamf APIs this module uses
#      .auth                 auth function to call (from lib/auth.sh)
#      .status               stable | beta | coming-soon
#      .warning              optional warning shown before deploy mode selection
# ═══════════════════════════════════════════════════════════════

version: "1.0"

menu:

  - id: jamf-pro
    label: "Jamf Pro"
    description: "Configurations for Jamf Pro using the Jamf Pro and Jamf Platform APIs"
    items:

      - id: jamf-setup-manager
        label: "Jamf Setup Manager"
        description: "Configure the Jamf Setup Manager enrollment experience"
        module: "modules/jamf-pro/jamf-setup-manager"
        apis:
          - jamf-pro
        auth: auth_jamf_pro
        status: beta
        warning: "This module is currently being developed and may have unexepected results."

      - id: jamf-setup-checklist
        label: "Jamf Setup Checklist"
        description: "Deploy a Jamf Setup Checklist configuration"
        module: "modules/jamf-pro/jamf-setup-checklist"
        apis:
          - jamf-pro
        auth: auth_jamf_pro
        status: coming-soon

      - id: platform-sso
        label: "Platform SSO"
        description: "Configure Platform Single Sign-On with an identity provider"
        items:

          - id: entra-id
            label: "Entra ID"
            description: "Platform SSO using Microsoft Entra ID"
            module: "modules/jamf-pro/platform-sso/entra-id"
            apis:
              - jamf-pro
              - azure-ad
            auth: auth_jamf_pro
            status: coming-soon

          - id: okta
            label: "Okta"
            description: "Platform SSO using Okta"
            module: "modules/jamf-pro/platform-sso/okta"
            apis:
              - jamf-pro
              - okta
            auth: auth_jamf_pro
            status: coming-soon

      - id: jamf-setup-reset
        label: "Jamf Setup and Reset"
        description: "Reset and reconfigure a Jamf environment"
        module: "modules/jamf-pro/jamf-setup-reset"
        apis:
          - jamf-pro
        auth: auth_jamf_pro
        status: coming-soon
        warning: "This module will reset your Jamf configuration. Ensure you have a backup before proceeding."

      - id: jamf-mobile-assist
        label: "Jamf Mobile Assist"
        description: "Configure Jamf Mobile Assist"
        module: "modules/jamf-pro/jamf-mobile-assist"
        apis:
          - jamf-pro
        auth: auth_jamf_pro
        status: coming-soon

      - id: internal-test
        label: "Internal Jamf test"
        description: "Configure a super secret internal test"
        module: "modules/jamf-pro/internal-test"
        apis:
          - jamf-pro
          - jamf-platform
        auth: auth_jamf_pro
        status: internal

  - id: jamf-protect
    label: "Jamf Protect"
    description: "Configurations for Jamf Protect using the Jamf Protect API"
    items:

      - id: custom-analytics
        label: "Custom Analytics"
        description: "Deploy custom analytics configurations for Jamf Protect"
        items:
          - id: openclaw_directory_created
            label: "Create analytic for OpenClaw Directory Created"
            description: "This creates a custom analytic that detects if the directory for OpenClaw is created."
            module: "modules/jamf-protect/custom-analytics/openclaw_directory_created"
            apis: 
              - jamf-protect
            auth: auth_jamf_protect_oauth2
            status: beta

          - id: openclaw_gateway_persistence
            label: "Create analytic for Openclaw Gateway Persistence"
            description: "This creates a custom analytic for detection of OpenClaw's gateway persistence (~/Library/LaunchAgents/ai.openclaw.gateway.plist)."
            module: "modules/jamf-protect/custom-analytics/openclaw_gateway_persistence"
            apis: 
              - jamf-protect
            auth: auth_jamf_protect_oauth2
            status: beta

          - id: openclaw_install
            label: "Create analytic for OpenClaw Install"
            description: "This creates a custom analytic for detection of OpenClaw installation commands from openclaw.ai."
            module: "modules/jamf-protect/custom-analytics/openclaw_install"
            apis: 
              - jamf-protect
            auth: auth_jamf_protect_oauth2
            status: beta

          - id: openclaw_onboard
            label: "Create analytic for OpenClaw Onboard"
            description: "This creates a custom analytic for detection of OpenClaw onboard command to initiate setup."
            module: "modules/jamf-protect/custom-analytics/openclaw_onboard"
            apis: 
              - jamf-protect
            auth: auth_jamf_protect_oauth2
            status: beta

            - id: openclaw_skill_install_clawhub
            label: "Create analytic for OpenClaw Skill Install ClawHub"
            description: "This creates a custom analytic for detection of skills installed from Clawhub via npx command."
            module: "modules/jamf-protect/custom-analytics/openclaw_skill_install_clawhub"
            apis: 
              - jamf-protect
            auth: auth_jamf_protect_oauth2
            status: beta

      - id: remediation-workflows
        label: "Remediation Workflows"
        description: "Configure automated remediation workflows in Jamf Protect"
        items: 

          - id: remediasoar
            label: "RemediaSOAR"
            description: "Configure a RemediaSOAR example Workflows"
            module: modules/jamf-protect/remediations/remediasoar
            apis:
              - jamf-pro
            auth: auth_jamf_pro
            status: coming-soon

          - id: aftermath
            label: "Aftermath"
            description: Configure a remediation using Aftermath SOAR Playbook"
            module: modules/jamf-protect/remediations/aftermath
            apis:
              - jamf-pro
            auth: auth_jamf_pro
            status: coming-soon

  - id: jamf-connect
    label: "Jamf Connect"
    description: "Configurations for Jamf Connect using the Jamf Pro and Jamf Security Cloud APIs"
    items:

      - id: connect-login
        label: "Configure Jamf Connect Login"
        description: "Configure Jamf Connect login window settings and identity provider"
        module: "modules/jamf-connect/connect-login"
        apis:
          - jamf-pro
        auth: auth_jamf_connect
        status: coming-soon

      - id: privilege-elevation
        label: "Configure Privilege Elevation"
        description: "Configure Jamf Connect privilege elevation policies"
        module: "modules/jamf-connect/privilege-elevation"
        apis:
          - jamf-pro
        auth: auth_jamf_pro
        status: coming-soon

      - id: access-policies
        label: "Configure Access Policies"
        description: "Configure access policies via the Jamf Security Cloud"
        module: "modules/jamf-connect/access-policies"
        apis:
          - jamf-security-cloud
        auth: auth_jamf_security_cloud_oauth2
        status: coming-soon
  - id: jamf-platform
    label: "Jamf Platform"
    description: "Configurations for Jamf Platform using the Jamf Platform APIs"
    items:

      - id: compliance-cis-lvl1
        label: "Configure CIS Level 1 Benchmark"
        description: "Configure CIS Level 1 Compliance Benchmark"
        module: "modules/jamf-platform/cis-lvl1"
        apis:
          - jamf-platform
        auth: auth_jamf_platform_oauth2
        status: coming-soon